<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" width="760" role="img" aria-labelledby="t">
<title id="t">Replay of a Sales MCP session: find a drill, price it, check stock and create quote Q-2026-000297.</title>
<style>@keyframes l0{0%,7.00%{opacity:0}7.50%,100%{opacity:1}}.l0{animation:l0 20s infinite}@keyframes l1{0%,8.75%{opacity:0}9.25%,100%{opacity:1}}.l1{animation:l1 20s infinite}@keyframes l2{0%,10.50%{opacity:0}11.00%,100%{opacity:1}}.l2{animation:l2 20s infinite}@keyframes l3{0%,12.25%{opacity:0}12.75%,100%{opacity:1}}.l3{animation:l3 20s infinite}@keyframes l4{0%,17.25%{opacity:0}17.75%,100%{opacity:1}}.l4{animation:l4 20s infinite}@keyframes l5{0%,19.00%{opacity:0}19.50%,100%{opacity:1}}.l5{animation:l5 20s infinite}@keyframes l6{0%,20.75%{opacity:0}21.25%,100%{opacity:1}}.l6{animation:l6 20s infinite}@keyframes l7{0%,25.75%{opacity:0}26.25%,100%{opacity:1}}.l7{animation:l7 20s infinite}@keyframes l8{0%,27.50%{opacity:0}28.00%,100%{opacity:1}}.l8{animation:l8 20s infinite}@keyframes l9{0%,32.50%{opacity:0}33.00%,100%{opacity:1}}.l9{animation:l9 20s infinite}@keyframes l10{0%,34.25%{opacity:0}34.75%,100%{opacity:1}}.l10{animation:l10 20s infinite}@keyframes l11{0%,36.00%{opacity:0}36.50%,100%{opacity:1}}.l11{animation:l11 20s infinite}@keyframes l12{0%,37.75%{opacity:0}38.25%,100%{opacity:1}}.l12{animation:l12 20s infinite}@keyframes l13{0%,39.50%{opacity:0}40.00%,100%{opacity:1}}.l13{animation:l13 20s infinite}@keyframes l14{0%,41.25%{opacity:0}41.75%,100%{opacity:1}}.l14{animation:l14 20s infinite}@keyframes l15{0%,43.00%{opacity:0}43.50%,100%{opacity:1}}.l15{animation:l15 20s infinite}@media (prefers-reduced-motion:reduce){text{animation:none!important}}</style>
<rect width="760" height="494" rx="10" fill="#111827"/>
<circle cx="20" cy="18" r="6" fill="#ef4444"/><circle cx="40" cy="18" r="6" fill="#f59e0b"/><circle cx="60" cy="18" r="6" fill="#22c55e"/>
<text x="80" y="23" font-family="Consolas, Menlo, monospace" font-size="13" fill="#9ca3af">sales-mcp, customer KES-001 (demo data)</text>
<text class="l0" x="20" y="76" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7dd3fc">&gt; search_catalog(query: &quot;cordless drill&quot;)</text>
<text class="l1" x="36" y="98" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">ACM-PTL-101  Cordless drill driver, 18 V, body only</text>
<text class="l2" x="36" y="120" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">ACM-PTL-102  Cordless drill driver, 18 V, with 2 Ah kit</text>
<text class="l3" x="36" y="142" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">ACM-PTL-103  Cordless drill driver, 18 V, hammer action, body only</text>
<text class="l4" x="20" y="186" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7dd3fc">&gt; get_price(offering: &quot;ACM-PTL-101&quot;, quantity: 2)</text>
<text class="l5" x="36" y="208" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">unit ZAR 1,606.50 (contractPrice)</text>
<text class="l6" x="36" y="230" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">net ZAR 3,213.00  VAT ZAR 481.95  total ZAR 3,694.95</text>
<text class="l7" x="20" y="274" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7dd3fc">&gt; check_stock(offering: &quot;ACM-PTL-101&quot;, quantity: 2)</text>
<text class="l8" x="36" y="296" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">availability: now  (in stock: 2)</text>
<text class="l9" x="20" y="340" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7dd3fc">&gt; create_quote(lines: [2 drills, 2 batteries], requestId: &quot;demo-0001&quot;)</text>
<text class="l10" x="36" y="362" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">Q-2026-000297  valid until 2026-12-28</text>
<text class="l11" x="36" y="384" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">1. ACM-PTL-101  2 x ZAR 1,606.50 = ZAR 3,213.00</text>
<text class="l12" x="36" y="406" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">2. ACM-PTL-302  2 x ZAR 1,186.80 = ZAR 2,373.60</text>
<text class="l13" x="36" y="428" font-family="Consolas, Menlo, monospace" font-size="13" fill="#e5e7eb">net ZAR 5,586.60  VAT ZAR 837.99</text>
<text class="l14" x="36" y="450" font-family="Consolas, Menlo, monospace" font-size="13" fill="#86efac">TOTAL ZAR 6,424.59</text>
<text class="l15" x="36" y="472" font-family="Consolas, Menlo, monospace" font-size="13" fill="#fbbf24">This quote is the offer. Chat text never is.</text>
</svg>
