name: CI

# Build, format-check and test every PR and every push to main (issue #4).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SalesMcp.slnx

      - name: Check formatting
        run: dotnet format SalesMcp.slnx --no-restore --verify-no-changes

      - name: Build (Release)
        run: dotnet build SalesMcp.slnx --no-restore -c Release

      - name: Test with coverage
        run: >
          dotnet test --solution SalesMcp.slnx --no-build -c Release
          --results-directory "${{ github.workspace }}/TestResults"
          --report-xunit-trx
          --coverage --coverage-output-format cobertura

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('TestResults/*.cobertura.xml') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/*.cobertura.xml
          targetdir: TestResults/coverage
          reporttypes: MarkdownSummaryGithub;Cobertura
          assemblyfilters: +SalesMcp.*;-*.Tests;-SalesMcp.IntegrationTests

      - name: Add coverage to job summary
        if: ${{ !cancelled() && hashFiles('TestResults/coverage/SummaryGithub.md') != '' }}
        run: cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
