version: 2
updates:
  # Keeps GitHub Actions pinned versions fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["type: ci"]

  # NuGet packages, versioned centrally in Directory.Packages.props (issue #6).
  # Minor and patch bumps arrive as one grouped PR. Major bumps get their own PR for review.
  # Docker is added when Dockerfiles exist (M5).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope # "build(deps): bump …"
    labels: ["type: chore"]
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
