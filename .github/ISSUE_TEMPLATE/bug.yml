name: Bug report
description: Something doesn't work as expected
title: "fix: "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the MCP client (Claude Desktop, Claude Code, Inspector), tool name and arguments if relevant.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
